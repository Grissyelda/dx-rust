# Release builds on GitHub's machines, started by the DX RUST Release Builder (or by hand: Actions > Release builds >
# Run workflow). macOS can only be built on a Mac, so this is how a Windows PC gets the macOS release; the Linux /
# Steam Deck job is the fallback for PCs without WSL. Each job uploads its archive as an artifact.
name: Release builds

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which releases: any of macos, linux, android (comma-separated)"
        required: true
        default: "macos,linux"
        type: string
      version:
        description: "Version for the macOS app bundle (e.g. 0.13.0)"
        required: false
        default: "dev"
        type: string
      fast:
        description: "Thin LTO (quicker build): true / false"
        required: false
        default: "false"
        type: string

env:
  CARGO_TERM_COLOR: never

jobs:
  macos:
    if: contains(inputs.platforms, 'macos')
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - name: Faster build
        if: inputs.fast == 'true'
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=thin" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"
      - name: Build
        run: bash BUILD_MAC.sh "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dxrust-macos
          path: dist/dxrust-macos.zip
          if-no-files-found: error

  linux:
    if: contains(inputs.platforms, 'linux')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - name: System packages
        run: sudo bash tools/release/setup_linux.sh root
      - name: zig
        run: python3 -m pip install --user ziglang
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        env:
          DXR_TARGET: ${{ github.workspace }}/target/linux
          DXR_FAST: ${{ inputs.fast == 'true' && '1' || '0' }}
        run: bash tools/release/build_linux.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: dxrust-steamdeck
          path: dist/dxrust-steamdeck.tar.xz
          if-no-files-found: error

  android:
    if: contains(inputs.platforms, 'android')
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-apk
      # Optional: a signing key kept as repository secrets (base64 keystore + password), so new builds install over
      # old ones. Without it the APK is signed with a fresh debug key.
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/dxrust.keystore"
            echo "DXR_KEYSTORE=$RUNNER_TEMP/dxrust.keystore" >> "$GITHUB_ENV"
            echo "DXR_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          DXR_TARGET: ${{ github.workspace }}/target/android
          DXR_FAST: ${{ inputs.fast == 'true' && '1' || '0' }}
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          bash tools/release/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dxrust-android
          path: dist/dxrust-android.apk
          if-no-files-found: error
