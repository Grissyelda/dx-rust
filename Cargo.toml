[workspace]
members = ["crates/imsim-core", "crates/unreal-pkg", "crates/dx-level", "crates/dxtool", "crates/dxview", "crates/imsim-audio"]
exclude = ["crates/dxlauncher"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"

# Quick local builds for screenshots: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 64
incremental = true
strip = false
panic = "unwind"
