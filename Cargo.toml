[workspace]
members = ["crates/imsim-core", "crates/unreal-pkg", "crates/dx-level", "crates/dxtool", "crates/dxview", "crates/imsim-audio", "crates/imsim-plants"]
exclude = ["crates/dxlauncher"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

# The shipped build: whole-program optimisation (fat LTO, one codegen unit) - slower to build, faster to run.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Quick local builds for screenshots: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 64
incremental = true
strip = false
panic = "unwind"
