<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6470"/><stop offset="0.5" stop-color="#2c323a"/><stop offset="1" stop-color="#15191e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d2dc"/><stop offset="0.5" stop-color="#6d7682"/><stop offset="1" stop-color="#2a2f36"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#fff2c4"/><stop offset="0.25" stop-color="#ffb43a"/><stop offset="0.6" stop-color="#d0560f"/><stop offset="1" stop-color="#4a1404"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a2a" stop-opacity="0.55"/><stop offset="1" stop-color="#ff9a2a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- gear: 12 teeth -->
  <g transform="translate(128 128)">
    <g fill="url(#rim)" stroke="#0c0f12" stroke-width="3">
      <path d="M -14 -122 L 14 -122 L 18 -100 L -18 -100 Z" transform="rotate(0)"/>
      <path d="M -14 -122 L 14 -122 L 18 -100 L -18 -100 Z" transform="rotate(30)"/>
      <path d="M -14 -122 L 14 -122 L 18 -100 L -18 -100 Z" transform="rotate(60)"/>
      <path d="M -14 -122 L 14 -122 L 18 -100 L -18 -100 Z" transform="rotate(90)"/>
      <path d="M -14 -122 L 14 -122 L 18 -100 L -18 -100 Z" transform="rotate(120)"/>
      <path d="M -14 -122 L 14 -122 L 18 -100 L -18 -100 Z" transform="rotate(150)"/>
      <path d="M -14 -122 L 14 -122 L 18 -100 L -18 -100 Z" transform="rotate(180)"/>
      <path d="M -14 -122 L 14 -122 L 18 -100 L -18 -100 Z" transform="rotate(210)"/>
      <path d="M -14 -122 L 14 -122 L 18 -100 L -18 -100 Z" transform="rotate(240)"/>
      <path d="M -14 -122 L 14 -122 L 18 -100 L -18 -100 Z" transform="rotate(270)"/>
      <path d="M -14 -122 L 14 -122 L 18 -100 L -18 -100 Z" transform="rotate(300)"/>
      <path d="M -14 -122 L 14 -122 L 18 -100 L -18 -100 Z" transform="rotate(330)"/>
    </g>
    <!-- hex plate -->
    <polygon points="0,-106 92,-53 92,53 0,106 -92,53 -92,-53" fill="url(#rim)" stroke="#0c0f12" stroke-width="4"/>
    <polygon points="0,-94 81,-47 81,47 0,94 -81,47 -81,-47" fill="url(#plate)" stroke="#0c0f12" stroke-width="2"/>
    <!-- circuit traces -->
    <g stroke="#e0782a" stroke-width="4" fill="none" stroke-linecap="square" opacity="0.85">
      <path d="M -78 0 L -58 0 L -50 -10"/>
      <path d="M 78 0 L 58 0 L 50 10"/>
      <path d="M 0 -90 L 0 -66"/>
      <path d="M 0 90 L 0 66"/>
    </g>
    <circle r="62" fill="url(#glow)"/>
    <!-- eye -->
    <circle r="50" fill="#0b0d10" stroke="url(#rim)" stroke-width="6"/>
    <circle r="40" fill="url(#lens)"/>
    <circle r="40" fill="none" stroke="#2a0a02" stroke-width="3"/>
    <circle r="27" fill="none" stroke="#ffd27a" stroke-width="2" opacity="0.6"/>
    <rect x="-40" y="-5" width="80" height="10" fill="#120403" opacity="0.9"/>
    <circle r="9" fill="#120403"/>
    <circle cx="-14" cy="-17" r="7" fill="#fff8e0" opacity="0.85"/>
  </g>
</svg>
