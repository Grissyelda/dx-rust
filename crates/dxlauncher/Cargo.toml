[package]
name = "dxlauncher"
license = "GPL-3.0-or-later"
edition = "2021"
version = "0.1.0"
description = "DX RUST launcher: pick the game folder and the display settings, then start the game."

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts", "x11"] }
rfd = "0.15.3"
unreal-pkg = { path = "../unreal-pkg" }
dx-level = { path = "../dx-level" }

[[bin]]
name = "dxlauncher"
path = "src/main.rs"

# Its own workspace: its dependencies (egui) must not change the game's Bevy feature set.
[workspace]

[profile.release]
opt-level = 3
strip = true
