[package]
name = "dxbuilder"
license = "GPL-3.0-or-later"
edition = "2021"
version = "0.1.0"
description = "DX RUST Release Builder: builds the Windows, Linux / Steam Deck and macOS releases from one window."

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts", "x11"] }
rfd = "0.15.3"
serde_json = "1"

[[bin]]
name = "dxbuilder"
path = "src/main.rs"

# Its own workspace, like the launcher: egui must not change the game's Bevy feature set.
[workspace]

[profile.release]
opt-level = 3
strip = true
