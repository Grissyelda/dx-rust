[package]
name = "dxandroid"
license = "GPL-3.0-or-later"
edition = "2021"
# The APK's versionName, and its versionCode (cargo-apk makes it from major.minor.patch: newer installs over older).
version = "0.13.0"
description = "DX RUST for Android (Classic): the game as a NativeActivity library, packaged into an APK by cargo-apk."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
dxview = { path = "../dxview" }
bevy = { version = "0.19.1", default-features = false }

# cargo apk build --release -p dxandroid (tools/release/build_android.sh sets the SDK / NDK paths).
[package.metadata.android]
package = "com.dxrust.game"
apk_name = "dxrust"
build_targets = ["aarch64-linux-android"]
resources = "res"
# Classic only, landscape, the whole screen.
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 34

[package.metadata.android.application]
label = "DX RUST"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.NoTitleBar.Fullscreen"
has_code = false
extract_native_libs = true

[package.metadata.android.application.activity]
orientation = "sensorLandscape"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|navigation|uiMode|density"
launch_mode = "singleTask"
exported = true

# Finding the game folder anywhere on the phone or an SD card (Android 11+: "All files access").
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

# Multiplayer: the lobby, direct codes and players on the same Wi-Fi.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_WIFI_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.CHANGE_WIFI_MULTICAST_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.version"
version = 0x401000
required = true

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.gamepad"
required = false
